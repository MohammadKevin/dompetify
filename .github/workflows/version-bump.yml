name: Auto Version Bump

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'VERSION'

permissions:
  contents: write

jobs:
  bump-version:
    name: Bump Patch Version
    runs-on: ubuntu-latest

    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      version_code: ${{ steps.bump.outputs.version_code }}
      skipped: ${{ steps.check.outputs.skipped }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 2

      - name: Check if version bump commit
        id: check
        run: |
          LAST_MSG=$(git log -1 --pretty=%s)
          if [[ "$LAST_MSG" == chore:\ bump\ version* ]]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version
        id: bump
        if: steps.check.outputs.skipped == 'false'
        run: |
          CURRENT=$(cat VERSION | tr -d '[:space:]')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))

          echo "$NEW_VERSION" > VERSION

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Bumped $CURRENT -> $NEW_VERSION (code: $VERSION_CODE)"

      - name: Commit version bump
        if: steps.check.outputs.skipped == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }}"
          git push

  trigger-build:
    name: Trigger Build & Deploy
    needs: bump-version
    if: needs.bump-version.outputs.skipped == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger APK Build
        uses: peter-evans/repository-dispatch@v3
        with:
          event-type: version-bumped
          client-payload: '{"version": "${{ needs.bump-version.outputs.new_version }}", "version_code": "${{ needs.bump-version.outputs.version_code }}"}'
