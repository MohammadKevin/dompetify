name: Deploy Laravel Backend to DomaiNesia cPanel (FTP)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build, Zip & FTP Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: ⚙️ Setup PHP 8.4 Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, curl, zip, gd
          tools: composer:v2

      - name: 📦 Install Composer Dependencies (Production)
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --ignore-platform-reqs

      - name: 📁 Ensure Storage Directory Structure
        run: |
          mkdir -p storage/app/public
          mkdir -p storage/framework/cache/data
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/logs
          chmod -R 775 storage bootstrap/cache

      - name: 🗜️ Package Release ZIP (Fast Transfer)
        run: |
          zip -r release.zip . -x \
            ".git/*" \
            ".github/*" \
            "node_modules/*" \
            "frontend/*" \
            "tests/*" \
            "phpunit.xml" \
            "README.md" \
            ".editorconfig" \
            ".env" \
            ".env.*" \
            "storage/logs/*" \
            "storage/framework/cache/data/*" \
            "storage/framework/sessions/*" \
            "storage/framework/views/*" \
            "storage/app/public/*" \
            ".claude/*" \
            ".kiro/*" \
            ".ai/*" \
            "boost.json" \
            ".phpunit.result.cache"

      - name: 🚀 Sync Files via FTP to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          server-dir: /
          dry-run: false
          dangerous-clean-slate: false
          exclude: |
            **/*
            !release.zip
            !public/unzip.php

      - name: ⚡ Instant Extraction on Server
        run: |
          curl -s -f "http://finance.corecraft.my.id/unzip.php?secret=${{ secrets.DEPLOY_SECRET || 'dompetify-secret-key-2026' }}" || \
          curl -k -L "https://finance.corecraft.my.id/unzip.php?secret=${{ secrets.DEPLOY_SECRET || 'dompetify-secret-key-2026' }}"